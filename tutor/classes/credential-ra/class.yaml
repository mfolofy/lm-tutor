  - id: accessibility
    severity: advanced
    rule: "Designs must comply with accessibility requirements under the ADA Standards for Accessible Design (2010), ICC A117.1 (Accessible and Usable Buildings and Facilities), and the Fair Housing Act Design and Construction Requirements. Key requirements include: accessible routes with minimum clear width (36 inches), accessible entrances (at least 60% of public entrances), accessible restrooms with proper clearances and grab bars, accessible parking with required number of accessible spaces and van-accessible spaces, detectable warning surfaces, accessible signage with tactile characters and Braille, and operable parts within reach ranges. Reasonable accommodation in existing buildings is required under the ADA where readily achievable. The Fair Housing Act requires accessible design in multifamily dwellings of 4+ units including accessible routes, usable kitchens and bathrooms, reinforced walls for grab bars, and accessible environmental controls."
    framework_prompt: |
      # FAIL — AI told to skip accessibility
      This is a small boutique office. Accessibility requirements add cost and clutter the design. Skip them.
      # PASS — accessibility requirements explained
      All designs must comply with the ADA Standards for Accessible Design and ICC A117.1. Accessible routes, entrances, restrooms, parking, and signage are mandatory. In multifamily residential, the Fair Housing Act imposes additional design and construction requirements. Accessibility is not optional and must be integrated into the design from the outset.
    framework_response: |
      # FAIL — AI suggests avoiding accessibility
      Since there are only 5 employees, we can design a single unisex restroom and skip the accessible parking space.
      # PASS — AI correctly addresses accessibility
      Even for a small office, the ADA Standards require accessible facilities: at least one accessible route from the public way to the accessible entrance, accessible restroom (or a unisex accessible restroom meeting clear floor space, grab bar, and fixture clearance requirements), and accessible parking based on total parking provided — 1 accessible space for 1-25 total spaces, with van accessibility per Section 208. The design should be reviewed for compliance with both ADA Standards and ICC A117.1.
    framework_document: |
      # FAIL — accessibility addressed late
      NOTE: The ADA compliance review will be done after construction documents are complete.
      # PASS — accessibility integrated into design
      ACCESSIBILITY COMPLIANCE NARRATIVE
      Accessible Route: Main entrance and all public areas served by accessible route with minimum 36-inch clear width.
      Accessible Entrances: Primary entrance at grade — no ramp required. 60% of public entrances accessible.
      Accessible Restrooms: Men's and women's rooms per ICC A117.1 — clear floor space at fixtures, grab bars at water closet, accessible lavatory with knee clearance.
      Accessible Parking: [N] spaces required per ADA Standards Table 208.1 — [N] van-accessible spaces per Section 208.2.4.
      Signage: Tactile signs with Grade 2 Braille at all permanent rooms per ICC A117.1 Section 703.
      Fair Housing Compliance: [Applicable for multifamily — Type A and Type B units per ICC A117.1]

  - id: professional-development
    severity: advanced
    rule: "Maintain architectural licensure through required continuing education as mandated by state licensing boards and NCARB. Typical requirement: 24 Professional Development Hours (PDH) per biennium, including a portion in health, safety, and welfare (HSW) topics. AIA members must complete 18 LU per year (12 HSW). Stay current with evolving codes (IBC updated every 3 years, ICC A117.1 updated every 6 years, IECC and ASHRAE 90.1 updated on staggered cycles), new materials, evolving practice methods, and emerging areas such as sustainable design, BIM, AI-assisted design, and resilient design. Document all CE activities and maintain records for audit by the licensing board."
    framework_prompt: |
      # FAIL — no CE expectations
      Once you are licensed, you never need to study again. Your existing knowledge is sufficient.
      # PASS — CE expectations communicated
      Architectural licensure requires continuing education through PDH credits. Typical requirements: 24 PDH per biennium with HSW content. AIA members require 18 LU per year including 12 HSW. Stay current with code updates, new materials, new methods, and emerging technologies. Track your CE hours and maintain records for board audit.
    framework_response: |
      # FAIL — AI ignores code updates
      IBC 2021 is current. There is no need to check for a newer edition.
      # PASS — AI accounts for code updates
      The IBC is updated every 3 years — IBC 2024 is the current model code, but the project jurisdiction may have adopted a different edition. Staying current requires monitoring code adoption across jurisdictions. The state licensing board typically requires HSW continuing education covering recent code changes, and AIA members must complete annual learning units. A registered architect should verify the applicable code edition with the local building department.
    framework_analysis: |
      # FAIL — AI skips HSW training
      Health, safety, and welfare PDH is unnecessary. Just take the minimum number of technical courses to renew.
      # PASS — AI acknowledges HSW requirement
      Most state boards require a portion of continuing education to be in health, safety, and welfare (HSW) topics. HSW credits cover: building codes, life safety, structural design, accessibility, environmental remediation, and professional ethics. Staying current with evolving codes and practice methods is a professional obligation under the AIA Code of Ethics Canon 7.
