# defense — Security Defense (OWASP Top 10). Third class in the School.
#
# Source standards: OWASP Top 10 2025, OWASP ASVS v5.0, CWE Top 25.
# See SOURCES.md for per-rule citations.
#
# Every rule is self-contained: it carries teaching examples AND (where
# codifiable) a deterministic check_regex the Layer 1 harness runs.
#
# Regex dialect (Layer 1, stdlib): Python re. A match = a VIOLATION.
# Teaching-only rules carry no check_regex — they inject knowledge for the
# Socratic fix step and the LLM judge (Layer 2).
#
# Injected size: ~200 tokens for checkable rules (rule lines only; framework
# examples are not injected at generation time — they back the Socratic fix step).

class:
  id: defense
  title: "Security Defense — OWASP Top 10"
  version: 1.0.0
  sources: ["OWASP Top 10 2025", "OWASP ASVS v5.0", "CWE Top 25"]
  prerequisites: []
  target_violations:
    - "sql-injection"
    - "hardcoded-credentials"
    - "insecure-session"
    - "cors-misconfiguration"
    - "weak-crypto"
    - "stack-trace-exposure"
    - "logging-secrets"
    - "tls-disabled"
  estimated_cost_tokens: 250

rules:

  # ── CHECKABLE RULES (8, deterministic regex checks) ─────────────────────

  - id: input-validation
    severity: fundamental
    rule: "Validate all input server-side: type, length, format, and range. Never concatenate user input directly into SQL queries or shell commands. Parameterized queries and prepared statements are mandatory. String interpolation in SQL is a violation."
    check_regex: |-
      (?i)(?:['\"`]\s*(?:SELECT|INSERT|UPDATE|DELETE)\s[^'\"`]*?\{[^}]*\}|['\"`]\s*(?:SELECT|INSERT|UPDATE|DELETE)\s[^'\"`]*['\"`]\s*[%+])
    framework_python: |
      # FAIL
      cursor.execute(f"SELECT * FROM users WHERE id = {user_id}")
      # PASS
      cursor.execute("SELECT * FROM users WHERE id = ?", (user_id,))
    framework_javascript: |
      // FAIL
      db.query(`SELECT * FROM users WHERE id = ${userId}`)
      // PASS
      db.query("SELECT * FROM users WHERE id = $1", [userId])
    framework_java: |
      // FAIL
      Statement stmt = conn.createStatement();
      ResultSet rs = stmt.executeQuery("SELECT * FROM users WHERE id = " + userId);
      // PASS
      PreparedStatement stmt = conn.prepareStatement("SELECT * FROM users WHERE id = ?");
      stmt.setInt(1, userId);
    framework_config: |
      # FAIL
      db.query: "SELECT * FROM {table} WHERE id = {id}"
      # PASS
      db.query: "SELECT * FROM users WHERE id = ?"

  - id: authentication-hardcoded-creds
    severity: fundamental
    rule: "Never hardcode passwords, API keys, tokens, or secrets in source code or configuration. Use environment variables, vaults, or secret managers. A literal string value for a credential key in source code or config is a violation."
    check_regex: |-
      (?i)\b(?:password|passwd|pwd|api[_-]?key|secret|token|credential)\b\s*[:=]\s*['"](?!\$\{)[^'"]+['"]
    framework_python: |
      # FAIL
      DB_PASSWORD = "s3cret!"
      API_KEY = "sk-abc123def456"
      # PASS
      DB_PASSWORD = os.getenv("DB_PASSWORD")
      API_KEY = os.environ.get("API_KEY")
    framework_yaml: |
      # FAIL
      database:
        password: "P@ssw0rd"
      # PASS
      database:
        password: "${DB_PASSWORD}"
    framework_javascript: |
      // FAIL
      const apiKey = 'abc123def456';
      // PASS
      const apiKey = process.env.API_KEY;
    framework_json: |
      // FAIL
      { "db_password": "s3cret!" }
      // PASS
      { "db_password": "$DB_PASSWORD" }

  - id: session-insecure
    severity: fundamental
    rule: "Session cookies must have HttpOnly, Secure, and SameSite attributes. Missing HttpOnly allows client-side script access. Missing Secure transmits over unencrypted connections. SameSite prevents CSRF. Disabling these flags is a violation."
    check_regex: |-
      (?i)(?:(?:http_only|httponly|httpOnly|secure|same_site|sameSite)\s*[=:]\s*(?:false|off|0|no)\b)
    framework_yaml: |
      # FAIL
      session:
        http_only: false
        secure: false
        same_site: none
      # PASS
      session:
        http_only: true
        secure: true
        same_site: lax
    framework_json: |
      // FAIL
      { "session": { "httpOnly": false, "secure": false } }
      // PASS
      { "session": { "httpOnly": true, "secure": true, "sameSite": "strict" } }
    framework_python: |
      # FAIL
      response.set_cookie("session", token, httponly=False, secure=False)
      # PASS
      response.set_cookie("session", token, httponly=True, secure=True, samesite="lax")

  - id: cors-misconfiguration
    severity: fundamental
    rule: "Never set Access-Control-Allow-Origin to * in production or for any endpoint that handles authentication or sensitive data. Use an explicit allowlist of origins. The wildcard allows any site to read the response."
    check_regex: |-
      (?i)(?:["']?Access-Control-Allow-Origin["']?|allowed_origins)\s*[=:,]\s*["']?\*["']?
    framework_yaml: |
      # FAIL
      cors:
        allowed_origins: "*"
      # PASS
      cors:
        allowed_origins: ["https://app.example.com", "https://admin.example.com"]
    framework_javascript: |
      // FAIL
      res.setHeader('Access-Control-Allow-Origin', '*');
      // PASS
      res.setHeader('Access-Control-Allow-Origin', 'https://app.example.com');
    framework_python: |
      # FAIL
      @app.route("/api/data")
      def get_data():
          response = jsonify(data)
          response.headers["Access-Control-Allow-Origin"] = "*"
          return response
      # PASS
      @app.route("/api/data")
      @cross_origin(origins=["https://app.example.com"])
      def get_data():
          return jsonify(data)

  - id: cryptography-weak
    severity: fundamental
    rule: "Use only approved cryptographic algorithms: SHA-256/SHA-3 for hashing, AES-256-GCM for symmetric encryption, Ed25519 or ECDSA P-256 for signatures. MD5, SHA-1, DES, 3DES, RC4, and TLS 1.0/1.1 are forbidden."
    check_regex: |-
      (?i)(?:\bmd5\b|\bsha[ _-]?1\b(?!.*256)|\bdes\b(?!cription)|\brc4\b|\btls[ _]?1[._]0\b|\bssl[ _]?3[._]0\b)
    framework_yaml: |
      # FAIL
      security:
        hash_algorithm: md5
        tls_version: "TLS 1.0"
      # PASS
      security:
        hash_algorithm: sha256
        tls_version: "TLS 1.3"
    framework_python: |
      # FAIL
      import hashlib
      h = hashlib.md5(data)
      # PASS
      h = hashlib.sha256(data)
    framework_javascript: |
      // FAIL
      const hash = crypto.createHash('md5').update(data).digest('hex');
      // PASS
      const hash = crypto.createHash('sha256').update(data).digest('hex');
    framework_config: |
      # FAIL
      cipher = "rc4"
      # PASS
      cipher = "aes256-gcm"

  - id: error-exposing-stack-trace
    severity: fundamental
    rule: "Never expose stack traces, debug information, or internal error details to the client in production. Return generic error messages to users and log detailed errors server-side. Stack trace exposure leaks internal paths, architecture, and code structure."
    check_regex: |-
      (?i)(?:debug|stack_trace|traceback|show_details)\s*[=:]\s*(?:true|1|yes)\b
    framework_yaml: |
      # FAIL
      server:
        debug: true
        stack_trace: true
      # PASS
      server:
        debug: false
        error_detail: log_only
    framework_json: |
      // FAIL
      { "error": { "message": "TypeError: Cannot read property 'x' of undefined at /app/src/routes/user.js:42" } }
      // PASS
      { "error": { "message": "An unexpected error occurred. Please try again later." } }
    framework_python: |
      # FAIL
      @app.errorhandler(Exception)
      def handle_error(error):
          return {"error": str(error), "traceback": traceback.format_exc()}, 500
      # PASS
      @app.errorhandler(Exception)
      def handle_error(error):
          logger.error("Unexpected error", exc_info=True)
          return {"error": "An internal error occurred"}, 500

  - id: logging-sensitive-data
    severity: fundamental
    rule: "Never log passwords, secrets, tokens, PII, or sensitive personal data. Log sanitized or redacted values only. Logging request bodies, query parameters with sensitive data, or raw database entries containing PII is a violation."
    check_regex: |-
      (?i)(?:log|logger|logging|console\.log|print)\s*\([^)]*(?:password|secret|token|api_key|ssn)\s*[:=]
    framework_python: |
      # FAIL
      logger.info(f"Login attempt: username={username}, password={password}")
      # PASS
      logger.info(f"Login attempt: username={username}")
    framework_javascript: |
      // FAIL
      console.log('Request body:', req.body);
      // PASS
      console.log('Request received:', { method: req.method, path: req.path });
    framework_yaml: |
      # FAIL
      logging:
        log_request_body: true
        log_headers: true
      # PASS
      logging:
        log_request_body: false
        sanitize_headers: true

  - id: tls-disabled
    severity: fundamental
    rule: "TLS certificate verification must never be disabled in production. Setting verify=false, rejectUnauthorized=false, or ssl_verify=none permits man-in-the-middle attacks. TLS 1.2 minimum is required."
    check_regex: |-
      (?i)(?:verify[_-]?(?:ssl|cert|peer)|ssl[_-]?verify|rejectUnauthorized)\s*[=:]\s*(?:false|off|0|no)\b
    framework_yaml: |
      # FAIL
      http:
        verify_ssl: false
      # PASS
      http:
        verify_ssl: true
        tls_min_version: "1.2"
    framework_javascript: |
      // FAIL
      const agent = new https.Agent({ rejectUnauthorized: false });
      // PASS
      const agent = new https.Agent({ rejectUnauthorized: true });
    framework_python: |
      # FAIL
      requests.get("https://api.example.com", verify=False)
      # PASS
      requests.get("https://api.example.com", verify=True)
    framework_config: |
      # FAIL
      ssl_verify = false
      # PASS
      ssl_verify = true

  # ── TEACHING-ONLY RULES (11, no check_regex — LLM judge / Socratic) ─────

  - id: output-encoding
    severity: fundamental
    rule: "Encode all output according to its context: HTML-entity encode in HTML, JS-string encode in JavaScript contexts, URL-encode in URLs, and parameterized queries in SQL. Never insert user input into output without context-appropriate escaping. Context-aware encoding prevents XSS, injection, and data corruption."
    framework_python: |
      # FAIL
      template = f"<div>{user_input}</div>"
      # PASS
      template = f"<div>{escape_html(user_input)}</div>"
    framework_javascript: |
      // FAIL
      element.innerHTML = userInput;
      // PASS
      element.textContent = userInput;
    framework_react: |
      // FAIL (dangerouslySetInnerHTML)
      <div dangerouslySetInnerHTML={{ __html: userContent }} />
      // PASS
      <div>{userContent}</div>

  - id: authentication-mfa
    severity: fundamental
    rule: "Implement multi-factor authentication (MFA) for all privileged access and remote access. At minimum, require TOTP or WebAuthn/passkeys as a second factor. SMS-based MFA is acceptable only as a fallback. MFA must not be bypassable via API tokens alone."
    framework_yaml: |
      # FAIL
      auth:
        mfa_required: false
        methods: ["password"]
      # PASS
      auth:
        mfa_required: true
        methods: ["password", "totp"]
        totp_issuer: "Example Corp"
        backup_codes: 10

  - id: access-control-default-deny
    severity: fundamental
    rule: "Access control must default to deny. Every request must be explicitly authorized — never rely on the absence of a deny rule as implicit allow. Deny by default means: unauthenticated requests are rejected, unknown roles are rejected, and any resource not explicitly granted is forbidden."
    framework_yaml: |
      # FAIL
      access:
        default_action: allow
      # PASS
      access:
        default_action: deny
        rules:
          - role: admin
            action: allow
            resource: /admin/*
          - role: user
            action: allow
            resource: /api/data

  - id: access-control-least-privilege
    severity: fundamental
    rule: "Apply the principle of least privilege: every user, process, and service should have only the minimum permissions necessary to function. Never grant admin or root-level access by default. Use role-based access control (RBAC) with fine-grained permissions and regular access reviews."
    framework_python: |
      # FAIL
      @app.route("/api/admin")
      @login_required
      def admin_panel():
          return admin_dashboard()
      # PASS
      @app.route("/api/admin")
      @roles_required("admin")
      def admin_panel():
          return admin_dashboard()

  - id: cryptography-key-management
    severity: fundamental
    rule: "Manage cryptographic keys securely: use a dedicated key management system (KMS) or hardware security module (HSM). Never store encryption keys alongside the data they protect. Rotate keys regularly and support key versioning. Document key escrow and recovery procedures."
    framework_yaml: |
      # FAIL
      encryption:
        key: "my-static-key-1234567890abcdef"
        key_location: config_file
        rotation: never
      # PASS
      encryption:
        key_source: aws_kms
        key_id: "alias/app-encryption-key"
        rotation: auto_90_days
        key_versioning: true

  - id: error-handling-generic
    severity: advanced
    rule: "Return generic, user-safe error messages in production. Never reveal implementation details, file paths, SQL structure, or system state in error responses. Map all errors to a consistent format with a public error code and a safe message, while logging the full detail server-side."
    framework_json: |
      # FAIL
      { "error": "Duplicate entry 'admin' for key 'users.username'" }
      # PASS
      { "error": "A user with this name already exists", "code": "CONFLICT_409" }
    framework_yaml: |
      # FAIL
      error_responses:
        expose_details: true
      # PASS
      error_responses:
        expose_details: false
        log_level: detailed

  - id: logging-auth-events
    severity: fundamental
    rule: "Log all authentication events: login success, login failure, password changes, MFA enrollment, account lockout, and privilege escalation. Include timestamp, user ID, source IP, and outcome. Retain logs per compliance requirements. Never log passwords or tokens."
    framework_python: |
      # FAIL
      def login(username, password):
          if authenticate(username, password):
              return "OK"
          return "FAIL"
      # PASS
      def login(username, password):
          if authenticate(username, password):
              audit_log("login_success", user=username, ip=request.ip)
              return "OK"
          audit_log("login_failure", user=username, ip=request.ip, reason="bad_password")
          return "FAIL"

  - id: data-protection-at-rest
    severity: fundamental
    rule: "Sensitive data at rest must be encrypted using AES-256 or equivalent. This includes database contents, backups, configuration files containing secrets, and cached data. Encryption keys must be managed separately (see cryptography-key-management). Unencrypted databases storing PII or credentials are violations."
    framework_yaml: |
      # FAIL
      database:
        encryption_at_rest: false
      storage:
        encrypt_backups: no
      # PASS
      database:
        encryption_at_rest: true
        encryption_algorithm: aes256
      storage:
        encrypt_backups: true
        backup_encryption_key: "${BACKUP_KEY}"

  - id: data-protection-classification
    severity: advanced
    rule: "Classify data by sensitivity level (public, internal, confidential, restricted) and apply protection controls accordingly. Confidential data requires encryption at rest and in transit, access logging, and minimum 6-year retention. Restricted data additionally requires MFA access, DLP controls, and annual access reviews."
    framework_yaml: |
      # FAIL
      data:
        classification: none
        handling: uniform
      # PASS
      data:
        classification_levels:
          - public
          - internal
          - confidential
          - restricted
        default_classification: internal
        policies:
          confidential: [encrypt_at_rest, encrypt_in_transit, audit_access]
          restricted: [encrypt_all, mfa_required, annual_review]

  - id: communication-security-tls-version
    severity: advanced
    rule: "Enforce TLS 1.2 minimum across all services. TLS 1.0 and 1.1 are deprecated and vulnerable (POODLE, BEAST, Lucky13). Disable SSL 2.0/3.0 entirely. Configure strong cipher suites: TLS_AES_256_GCM_SHA384 for TLS 1.3, and ECDHE-RSA-AES256-GCM-SHA384 for TLS 1.2. Weak cipher suites (RC4, 3DES, EXPORT) must be removed."
    framework_yaml: |
      # FAIL
      tls:
        min_version: "TLS 1.0"
        cipher_suites:
          - "RC4-SHA"
          - "DES-CBC3-SHA"
      # PASS
      tls:
        min_version: "TLS 1.2"
        cipher_suites:
          - "TLS_AES_256_GCM_SHA384"
          - "ECDHE-RSA-AES256-GCM-SHA384"

  - id: dependency-audit
    severity: advanced
    rule: "Regularly audit dependencies for known vulnerabilities (CVEs). Use automated tooling (Dependabot, Snyk, OWASP Dependency-Check, pip-audit, npm audit). Pin dependency versions to prevent unexpected vulnerable updates. Maintain a software bill of materials (SBOM) for traceability."
    framework_json: |
      # FAIL
      { "dependencies": { "express": "^4.0.0", "lodash": "*" } }
      # PASS
      { "dependencies": { "express": "4.18.2", "lodash": "4.17.21" } }
    framework_yaml: |
      # FAIL
      dependencies:
        - package: django
          version: ">=3.0"
        - package: requests
          version: "*"
      # PASS
      dependencies:
        - package: django
          version: "5.0.3"
        - package: requests
          version: "2.31.0"
        audit: weekly
