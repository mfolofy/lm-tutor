[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lm-tutor"
version = "0.1.0"
description = "The School for LLMs -- structured AI education for any model. Phase 0: skeleton + Layer 1 rules engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mfolofy" }]
keywords = ["llm", "education", "mcp", "accessibility", "wcag", "eval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

# Core deps only. Class-specific deps install lazily into per-class venvs.
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Constrained-decoding certificates (tutor.cert). The Layer-A structural
# certificate + its proofs need only greenery/interegular on top of core;
# outlines/transformers/torch are the Layer-B demonstration decoder only.
cert = [
    "greenery>=4.0",
    "interegular>=0.3",
    "outlines>=0.0.30",
    "transformers>=4.40",
    "torch>=2.2",
    "datasets>=2.0",  # outlines' tokenizer hashing imports datasets.fingerprint
]
# The airtight structural layer alone, without the heavy model demo deps.
cert-core = [
    "greenery>=4.0",
    "interegular>=0.3",
]

[project.urls]
Homepage = "https://github.com/mfolofy/lm-tutor"
Repository = "https://github.com/mfolofy/lm-tutor"

# Single console script. Subcommands are dispatched by argparse in tutor.__main__.
[project.scripts]
tutor = "tutor.__main__:main"

[tool.setuptools.packages.find]
include = ["tutor*"]

# NOTE: glob keys like "tutor.classes.*" are rejected by setuptools >= 74
# (keys must be package names or "*"), which broke `pip install -e .` outright.
[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.md", "_requirements.txt"]

[tool.pytest.ini_options]
markers = [
    "slow: heavier cert tests (from_fsm render, real-model e2e) — deselect with -m 'not slow'",
]
